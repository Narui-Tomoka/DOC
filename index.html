<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="src/images/favicon.ico" />
    <title>PON DESIGN | トップページ</title>
  </head>
  <body class="p-page-home">
    <header id="header" class="l-header">
      <a href="#" class="l-header__logo">
        <img src="src/images/logo.svg" alt="PON DESIGNロゴ" />
      </a>
      <ul class="l-header__list u-pc-only">
        <li class="l-header__item">
          <a href="#" class="l-header__link">NEWS</a>
        </li>
        <li class="l-header__item">
          <a href="#" class="l-header__link">SERVICE</a>
        </li>
        <li class="l-header__item">
          <a href="#" class="l-header__link">WORKS</a>
        </li>
        <li class="l-header__item">
          <a href="#" class="l-header__link">COMPANY</a>
        </li>
        <li class="l-header__item">
          <a href="#" class="l-header__link">RECRUIT</a>
        </li>
        <li class="l-header__item">
          <a href="#" class="l-header__link">CONTACT</a>
        </li>
      </ul>

      <!-- スマホ用ハンバーガーボタン -->
      <button
        class="l-header__hamburger"
        type="button"
        aria-label="メニューを開く"
        aria-controls="sp-nav"
        aria-expanded="false"
      >
        <span class="l-header__hamburger-line"></span>
        <span class="l-header__hamburger-line"></span>
        <span class="l-header__hamburger-line"></span>
      </button>

      <!-- スマホ用全画面メニュー -->
      <nav id="sp-nav" class="l-header__sp-nav" aria-hidden="true">
        <ul class="l-header__sp-list">
          <li class="l-header__sp-item">
            <a href="#" class="l-header__sp-link">NEWS</a>
          </li>
          <li class="l-header__sp-item">
            <a href="#" class="l-header__sp-link">SERVICE</a>
          </li>
          <li class="l-header__sp-item">
            <a href="#" class="l-header__sp-link">WORKS</a>
          </li>
          <li class="l-header__sp-item">
            <a href="#" class="l-header__sp-link">COMPANY</a>
          </li>
          <li class="l-header__sp-item">
            <a href="#" class="l-header__sp-link">RECRUIT</a>
          </li>
          <li class="l-header__sp-item">
            <a href="#" class="l-header__sp-link">CONTACT</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="hero" class="p-hero">
        <!-- 文字が画面端にくっついてしまわないために幅を制限 -->
        <div class="p-hero__inner">
          <h1 class="p-hero__title f-mont">WEB DESIGN SPECIALIST</h1>
          <h2 class="p-hero__subtitle">お客様の夢を叶えるWebサイトを制作</h2>
          <a href="#" class="p-hero__button c-button c-button--trans"
            >CONTACT</a
          >
        </div>
      </section>
      <section id="news" class="p-news">
        <h2 class="p-news__title">
          <span class="p-news__title--en">NEWS</span>
          <span class="p-news__title--ja">お知らせ</span>
        </h2>
      </section>
    </main>

    <footer id="footer" class="l-footer">
      <nav class="l-footer__nav">
        <div class="l-footer__row">
          <a href="index.html" class="l-footer__link">HOME</a>
          <a href="#" class="l-footer__link">NEWS</a>
          <a href="#" class="l-footer__link">SERVICE</a>
          <a href="#" class="l-footer__link">WORKS</a>
        </div>

        <div class="l-footer__row">
          <a href="#" class="l-footer__link">COMPANY</a>
          <a href="#" class="l-footer__link">RECRUIT</a>
          <a href="#" class="l-footer__link">CONTACT</a>
        </div>
      </nav>

      <div class="l-footer__copy">
        <a href="index.html" class="l-footer__copy-link">© PON DESIGN</a>
      </div>
    </footer>
    <a href="#" class="c-pagetop" aria-label="ページトップへ戻る">
      <span class="c-pagetop__arrow"></span>
    </a>
    <script type="module" src="/src/js/pages/index.js"></script>
  </body>
</html>
