<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="icon" href="src/images/favicon.ico" />
    <title>PON DESIGN | お問い合わせ</title>
  </head>
  <body class="p-page-contact">
    <header id="header" class="l-header">
      <a href="index.html" class="l-header__logo">
        <img src="src/images/logo.svg" alt="PON DESIGNロゴ" />
      </a>
      <ul class="l-header__list u-pc-only u-ls-05">
        <li class="l-header__item">
          <a href="news.html" class="l-header__link u-font-mont-bold u-ls-05"
            >NEWS</a
          >
        </li>
        <li class="l-header__item">
          <a href="service.html" class="l-header__link u-font-mont-bold u-ls-05"
            >SERVICE</a
          >
        </li>
        <li class="l-header__item">
          <a href="works.html" class="l-header__link u-font-mont-bold u-ls-05"
            >WORKS</a
          >
        </li>
        <li class="l-header__item">
          <a href="company.html" class="l-header__link u-font-mont-bold u-ls-05"
            >COMPANY</a
          >
        </li>
        <li class="l-header__item">
          <a href="recruit.html" class="l-header__link u-font-mont-bold u-ls-05"
            >RECRUIT</a
          >
        </li>
        <li class="l-header__item">
          <a href="contact.html" class="l-header__link u-font-mont-bold u-ls-05"
            >CONTACT</a
          >
        </li>
      </ul>

      <!-- スマホ用ハンバーガーボタン -->
      <button
        class="l-header__hamburger"
        type="button"
        aria-label="メニューを開く"
        aria-controls="sp-nav"
        aria-expanded="false"
      >
        <span class="l-header__hamburger-line"></span>
        <span class="l-header__hamburger-line"></span>
        <span class="l-header__hamburger-line"></span>
      </button>

      <!-- スマホ用全画面メニュー -->
      <nav id="sp-nav" class="l-header__sp-nav" aria-hidden="true">
        <ul class="l-header__sp-list">
          <li class="l-header__sp-item">
            <a
              href="news.html"
              class="l-header__sp-link u-font-mont-bold u-ls-05 u-lh-10"
              >NEWS</a
            >
          </li>
          <li class="l-header__sp-item">
            <a
              href="service.html"
              class="l-header__sp-link u-font-mont-bold u-ls-05 u-lh-10"
              >SERVICE</a
            >
          </li>
          <li class="l-header__sp-item">
            <a
              href="works.html"
              class="l-header__sp-link u-font-mont-bold u-ls-05 u-lh-10"
              >WORKS</a
            >
          </li>
          <li class="l-header__sp-item">
            <a
              href="company.html"
              class="l-header__sp-link u-font-mont-bold u-ls-05 u-lh-10"
              >COMPANY</a
            >
          </li>
          <li class="l-header__sp-item">
            <a
              href="recruit.html"
              class="l-header__sp-link u-font-mont-bold u-ls-05 u-lh-10"
              >RECRUIT</a
            >
          </li>
          <li class="l-header__sp-item">
            <a
              href="contact.html"
              class="l-header__sp-link u-font-mont-bold u-ls-05 u-lh-10"
              >CONTACT</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="hero" class="p-hero">
        <h1
          class="p-hero__title u-text-center u-font-mont-bold u-lh-11 u-ls-05"
        >
          CONTACT
          <span class="c-section-heading__sub p-hero-heading__sub"
            >お問い合わせ</span
          >
        </h1>
      </section>

      <nav class="c-breadcrumb" aria-label="パンくずリスト">
        <div class="l-inner">
          <ol class="c-breadcrumb__list">
            <li class="c-breadcrumb__item">
              <a
                href="index.html"
                class="c-breadcrumb__link u-font-mont u-lh-18 u-ls-05"
                >HOME</a
              >
            </li>
            <li class="c-breadcrumb__item">
              <span
                class="c-breadcrumb__current u-font-mont u-lh-18 u-ls-05"
                aria-current="page"
                >CONTACT</span
              >
            </li>
          </ol>
        </div>
      </nav>

      <section id="contact" class="p-contact">
        <div class="p-contact__inner l-inner--narrow">
          <p class="p-contact__lead u-ls-05 u-lh-18">
            Webサイトの制作のご依頼やお見積りなど、お気軽にご相談ください。
          </p>
          <form class="p-contact__form" action="#" method="post">
            <!-- お問い合わせ種別 -->
            <fieldset class="p-contact__field p-contact__field--radio">
              <legend class="p-contact__label u-ls-05 u-lh-18">
                お問い合わせ種別
                <span class="p-contact__required u-ls-05 u-lh-12">*必須</span>
              </legend>

              <div class="p-contact__radio-list">
                <label class="p-contact__radio">
                  <input
                    type="radio"
                    name="contact-type"
                    value="work"
                    class="p-contact__radio-input"
                    required
                  />
                  <span class="p-contact__radio-text"
                    >お仕事のご依頼・ご相談</span
                  >
                </label>

                <label class="p-contact__radio">
                  <input
                    type="radio"
                    name="contact-type"
                    value="estimate"
                    class="p-contact__radio-input"
                  />
                  <span class="p-contact__radio-text">お見積りのご依頼</span>
                </label>

                <label class="p-contact__radio">
                  <input
                    type="radio"
                    name="contact-type"
                    value="recruit"
                    class="p-contact__radio-input"
                  />
                  <span class="p-contact__radio-text">採用について</span>
                </label>

                <label class="p-contact__radio">
                  <input
                    type="radio"
                    name="contact-type"
                    value="other"
                    class="p-contact__radio-input"
                  />
                  <span class="p-contact__radio-text">その他</span>
                </label>
              </div>
            </fieldset>

            <!-- お名前 -->
            <div class="p-contact__field">
              <label for="name" class="p-contact__label">
                お名前
                <span class="p-contact__required">*必須</span>
              </label>
              <input
                type="text"
                id="name"
                name="name"
                class="p-contact__input"
                required
              />
            </div>

            <!-- 会社名 -->
            <div class="p-contact__field">
              <label for="company" class="p-contact__label">
                会社名
                <span class="p-contact__required">*必須</span>
              </label>
              <input
                type="text"
                id="company"
                name="company"
                class="p-contact__input"
                required
              />
            </div>

            <!-- メールアドレス -->
            <div class="p-contact__field">
              <label for="email" class="p-contact__label">
                メールアドレス
                <span class="p-contact__required">*必須</span>
              </label>
              <input
                type="email"
                id="email"
                name="email"
                class="p-contact__input"
                required
              />
            </div>

            <!-- 電話番号 -->
            <div class="p-contact__field">
              <label for="tel" class="p-contact__label">
                電話番号
                <span class="p-contact__note">（半角数字ハイフンなし）</span>
              </label>
              <input
                type="tel"
                id="tel"
                name="tel"
                class="p-contact__input"
                inputmode="tel"
              />
            </div>

            <!-- お問い合わせ内容 -->
            <div class="p-contact__field">
              <label for="message" class="p-contact__label">
                お問い合わせ内容
              </label>
              <textarea
                id="message"
                name="message"
                class="p-contact__textarea"
                placeholder="お問い合わせ内容を具体的にご記入くださいませ。"
              ></textarea>
            </div>

            <!-- きっかけ -->
            <div class="p-contact__field">
              <label for="trigger" class="p-contact__label u-lh-12">
                PON DESIGNをどちらで<br
                  class="u-sp-only"
                />お知りになりましたか？
                <span class="p-contact__required">*必須</span>
              </label>

              <select
                id="trigger"
                name="trigger"
                class="p-contact__select"
                required
              >
                <option value="" selected disabled>選択してください</option>
                <option value="google-yahoo">Google/Yahoo検索</option>
                <option value="sns">SNS</option>
                <option value="blog">ブログ</option>
                <option value="friend">友人や知人</option>
                <option value="other">その他</option>
              </select>
            </div>

            <!-- 送信ボタン -->
            <div class="p-contact__button">
              <button
                type="submit"
                class="c-button c-button-gradient u-font-mont-bold u-ls-10 u-fs-14"
              >
                <span>送信する</span>
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer id="footer" class="l-footer">
      <nav class="l-footer__nav">

        <div class="l-footer__row">
          <a href="company.html" class="l-footer__link u-font-mont u-ls-10"

          >
          <a href="recruit.html" class="l-footer__link u-font-mont u-ls-10"
            >RECRUIT</a
          >
          <a href="contact.html" class="l-footer__link u-font-mont u-ls-10"
            >CONTACT</a
          >
        </div>
      </nav>

      <div class="l-footer__copy u-ls-05">
        <a href="index.html" class="l-footer__copy-link u-font-mont"

      </div>
    </footer>

    <a href="#" class="c-pagetop" aria-label="ページトップへ戻る">

    <script type="module" src="/src/js/pages/news.js"></script>
  </body>
</html>
